name: build-and-push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output type=oci,dest=image.tar \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            . 2>&1 | tee build.log

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  push:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.ecr.outputs.registry }}/demo-app:${{ github.sha }}
      registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Push to ECR
        run: |
          skopeo copy --all \
            oci-archive:image.tar \
            docker://${{ steps.ecr.outputs.registry }}/demo-app:${{ github.sha }} \
            2>&1 | tee push.log

      - name: Upload push log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-log
          path: push.log

  update-gitops:
    name: Update GitOps Repo
    needs: [push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: dmakeroam/lab2-eks-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image in kustomization.yaml
        working-directory: config/hello-world
        run: |
          kustomize edit set image demo-app=${{ needs.push.outputs.image_uri }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/hello-world/kustomization.yaml
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(gitops): update demo-app image to ${{ github.sha }}"
          git push

  diagnose:
    needs: [build, push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log
        continue-on-error: true

      - name: Download push log
        uses: actions/download-artifact@v4
        with:
          name: push-log
        continue-on-error: true

      - name: Merge logs
        run: |
          { cat build.log 2>/dev/null || true; cat push.log 2>/dev/null || true; } > combined.log
          [ -s combined.log ] || echo "no logs captured" > combined.log

      - name: Diagnose failure
        uses: faultline-cli/action@0.2.0
        with:
          log: combined.log
          annotations: true
          workflow: true
          workflow-mode: agent
