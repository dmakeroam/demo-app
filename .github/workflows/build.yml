name: build-and-push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output type=oci,dest=image.tar \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            . 2>&1 | tee build.log

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  push:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Push to ECR
        run: |
          skopeo copy --all \
            oci-archive:image.tar \
            docker://${{ steps.ecr.outputs.registry }}/demo-app:${{ github.sha }} \
            2>&1 | tee push.log

      - name: Upload push log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-log
          path: push.log

  diagnose:
    needs: [build, push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log
        continue-on-error: true

      - name: Download push log
        uses: actions/download-artifact@v4
        with:
          name: push-log
        continue-on-error: true

      - name: Merge logs
        run: |
          cat build.log push.log > combined.log 2>/dev/null
          [ -s combined.log ] || echo "no logs captured" > combined.log

      - name: Diagnose failure
        uses: faultline-cli/faultline-action@0.1.0
        with:
          log: combined.log
          annotations: true
          workflow: true
          workflow-mode: agent
